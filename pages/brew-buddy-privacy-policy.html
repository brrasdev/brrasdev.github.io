<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Privacy Policy</title>
        <style>
            :root {
                color-scheme: light;
                --bg: #f7f4ee;
                --card: #fffdf8;
                --text: #1f2328;
                --muted: #5f6b73;
                --border: #ddd4c7;
                --accent: #7b4f2b;
                --accent-soft: #f0e3d4;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                font-family: Georgia, "Times New Roman", serif;
                background:
                    radial-gradient(
                        circle at top left,
                        #fff8ef 0,
                        transparent 34%
                    ),
                    linear-gradient(180deg, #fbf7f1 0%, var(--bg) 100%);
                color: var(--text);
            }

            main {
                max-width: 920px;
                margin: 0 auto;
                padding: 48px 20px 72px;
            }

            .panel {
                background: rgba(255, 253, 248, 0.92);
                border: 1px solid var(--border);
                border-radius: 22px;
                box-shadow: 0 18px 48px rgba(60, 39, 17, 0.08);
                padding: 32px;
                backdrop-filter: blur(6px);
            }

            header {
                margin-bottom: 28px;
                padding-bottom: 20px;
                border-bottom: 1px solid var(--border);
            }

            h1 {
                margin: 0;
                font-size: clamp(2.2rem, 4vw, 3.5rem);
                line-height: 1.05;
                letter-spacing: -0.03em;
            }

            .updated {
                margin: 10px 0 0;
                color: var(--muted);
                font-size: 0.98rem;
            }

            .intro,
            .section {
                margin-top: 28px;
            }

            .section h2 {
                margin: 0 0 12px;
                font-size: 1.45rem;
                line-height: 1.2;
                color: var(--accent);
            }

            .subsection {
                margin-top: 18px;
                padding: 18px;
                border: 1px solid var(--border);
                border-radius: 18px;
                background: var(--card);
            }

            p {
                margin: 0 0 12px;
                line-height: 1.7;
            }

            ul {
                margin: 12px 0 0;
                padding-left: 1.25rem;
            }

            li + li {
                margin-top: 10px;
            }

            .bullet-title {
                font-weight: 700;
                display: block;
                margin-bottom: 2px;
            }

            .loading,
            .error {
                padding: 18px 20px;
                border-radius: 14px;
                background: var(--card);
                border: 1px solid var(--border);
                color: var(--muted);
            }

            .error {
                color: #8a2f2f;
                border-color: #e6b7b7;
                background: #fff7f7;
            }

            @media (max-width: 640px) {
                main {
                    padding: 16px;
                }

                .panel {
                    padding: 22px 18px;
                    border-radius: 18px;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <div class="panel" id="app">
                <div class="loading">Loading privacy policy…</div>
            </div>
        </main>

        <script>
            const dataUrl = new URL(
                "../data/brew-buddy-privacy.json",
                document.baseURI,
            );

            function createElement(tagName, className, textContent) {
                const element = document.createElement(tagName);
                if (className) element.className = className;
                if (textContent !== undefined)
                    element.textContent = textContent;
                return element;
            }

            function appendParagraphs(container, paragraphs) {
                (paragraphs || []).forEach((paragraph) => {
                    container.appendChild(createElement("p", "", paragraph));
                });
            }

            function appendBulletList(container, items) {
                if (!items || !items.length) return;

                const list = document.createElement("ul");
                items.forEach((item) => {
                    const listItem = document.createElement("li");

                    if (typeof item === "string") {
                        listItem.textContent = item;
                    } else {
                        const header = createElement(
                            "span",
                            "bullet-title",
                            item.header,
                        );
                        const statement = createElement(
                            "span",
                            "",
                            item.statement,
                        );
                        listItem.append(header, statement);
                    }

                    list.appendChild(listItem);
                });

                container.appendChild(list);
            }

            function renderSection(section) {
                const sectionElement = createElement("section", "section");
                sectionElement.id = `section-${section.id}`;

                sectionElement.appendChild(
                    createElement("h2", "", section.title),
                );
                appendParagraphs(sectionElement, section.paragraphs);
                appendBulletList(sectionElement, section.bullets);

                (section.subSections || []).forEach((subSection) => {
                    const subSectionElement = createElement(
                        "div",
                        "subsection",
                    );
                    subSectionElement.id = `section-${section.id}-${subSection.id}`;

                    subSectionElement.appendChild(
                        createElement("h3", "", subSection.subSectionTitle),
                    );
                    appendParagraphs(
                        subSectionElement,
                        subSection.subSectionParagraphs,
                    );
                    appendBulletList(
                        subSectionElement,
                        subSection.subSectionBullets,
                    );
                    appendParagraphs(
                        subSectionElement,
                        subSection.subSectionSecondaryParagraphs,
                    );

                    sectionElement.appendChild(subSectionElement);
                });

                appendParagraphs(sectionElement, section.secondaryParagraphs);
                appendBulletList(sectionElement, section.secondaryBullets);

                return sectionElement;
            }

            function renderPolicy(data) {
                const app = document.getElementById("app");
                app.replaceChildren();

                document.title = data.title;

                const header = document.createElement("header");
                header.appendChild(createElement("h1", "", data.title));
                header.appendChild(
                    createElement(
                        "p",
                        "updated",
                        `Last updated: ${data.lastUpdated}`,
                    ),
                );
                app.appendChild(header);

                const intro = createElement("section", "intro");
                intro.id = "intro";
                (data.intro || []).forEach((entry) => {
                    const introBlock = createElement("div", "");
                    introBlock.id = entry.id || "intro";
                    appendParagraphs(introBlock, entry.paragraphs);
                    intro.appendChild(introBlock);
                });
                app.appendChild(intro);

                (data.sections || []).forEach((section) => {
                    app.appendChild(renderSection(section));
                });
            }

            (async () => {
                try {
                    const response = await fetch(dataUrl);
                    if (!response.ok) {
                        throw new Error(
                            `Failed to load privacy policy data (${response.status})`,
                        );
                    }

                    renderPolicy(await response.json());
                } catch (error) {
                    const app = document.getElementById("app");
                    app.replaceChildren(
                        createElement(
                            "div",
                            "error",
                            `Unable to load the privacy policy data from ${dataUrl.pathname}. ${error.message}`,
                        ),
                    );
                }
            })();
        </script>
    </body>
</html>
